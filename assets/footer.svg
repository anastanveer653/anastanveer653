<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-labelledby="title desc">
  <title id="title">Let's work together</title>
  <desc id="desc">Hiring for an IT infrastructure, systems or network role, on-site or remote? Email anastanveer653@gmail.com or find me on LinkedIn at in/anastanveer-it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f3f"/>
      <stop offset="0.5" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.10"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>
  <rect width="1280" height="220" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="220" rx="16" fill="url(#dots)"/>
  <rect x="340" y="0" width="600" height="3" fill="url(#line)">
    <animate attributeName="x" values="-600;1280" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="640" y="80" class="sans" font-size="40" font-weight="700" fill="#f8fafc" text-anchor="middle">Let's work together</text>
  <text x="640" y="120" class="sans" font-size="19" fill="#cbd5e1" text-anchor="middle">IT infrastructure, systems and network roles · on-site or remote</text>

  <rect x="420" y="146" width="440" height="44" rx="22" fill="#2dd4bf"/>
  <text x="640" y="174" class="mono" font-size="18" font-weight="700" fill="#0b1220" text-anchor="middle">anastanveer653@gmail.com</text>
</svg>
