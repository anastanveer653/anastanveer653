<svg xmlns="http://www.w3.org/2000/svg" width="440" height="214" viewBox="0 0 440 214" role="img" aria-label="Docker Monitoring Stack: One-command Prometheus, Grafana and Alertmanager. 4 dashboards, runbooks, full-stack CI smoke test.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#10273a"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="212" rx="14" fill="url(#bg)" stroke="#1e3a4f"/>
  <rect x="1" y="1" width="6" height="212" rx="3" fill="#fb923c"/>
  <text x="28" y="36" class="mono" font-size="11" letter-spacing="1.5" fill="#fb923c">OBSERVABILITY</text>
  <text x="28" y="68" class="sans" font-size="22" font-weight="700" fill="#f8fafc">Docker Monitoring Stack</text>
  <text x="28" y="104" class="sans" font-size="14" fill="#cbd5e1">One-command Prometheus, Grafana and Alertmanager.</text>
  <text x="28" y="126" class="sans" font-size="14" fill="#cbd5e1">4 dashboards, runbooks, full-stack CI smoke test.</text>
  <text x="412" y="62" class="sans" font-size="34" font-weight="800" fill="#fb923c" text-anchor="end">21</text>
  <text x="412" y="80" class="mono" font-size="11" fill="#94a3b8" text-anchor="end">tested alerts</text>
  <rect x="28" y="166" width="90" height="24" rx="12" fill="#fb923c" fill-opacity="0.14" stroke="#fb923c" stroke-opacity="0.45"/>
  <text x="73" y="182" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Prometheus</text>
  <rect x="126" y="166" width="69" height="24" rx="12" fill="#fb923c" fill-opacity="0.14" stroke="#fb923c" stroke-opacity="0.45"/>
  <text x="160" y="182" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Grafana</text>
  <rect x="203" y="166" width="69" height="24" rx="12" fill="#fb923c" fill-opacity="0.14" stroke="#fb923c" stroke-opacity="0.45"/>
  <text x="237" y="182" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Compose</text>
</svg>
