<svg xmlns="http://www.w3.org/2000/svg" width="440" height="214" viewBox="0 0 440 214" role="img" aria-label="Linux Server Automation: Turns a fresh Ubuntu, Debian or RHEL server into a hardened, monitored host. Idempotent.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#10273a"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="212" rx="14" fill="url(#bg)" stroke="#1e3a4f"/>
  <rect x="1" y="1" width="6" height="212" rx="3" fill="#f87171"/>
  <text x="28" y="36" class="mono" font-size="11" letter-spacing="1.5" fill="#f87171">LINUX · AUTOMATION</text>
  <text x="28" y="68" class="sans" font-size="22" font-weight="700" fill="#f8fafc">Linux Server Automation</text>
  <text x="28" y="104" class="sans" font-size="14" fill="#cbd5e1">Turns a fresh Ubuntu, Debian or RHEL server</text>
  <text x="28" y="126" class="sans" font-size="14" fill="#cbd5e1">into a hardened, monitored host. Idempotent.</text>
  <text x="412" y="62" class="sans" font-size="34" font-weight="800" fill="#f87171" text-anchor="end">6</text>
  <text x="412" y="80" class="mono" font-size="11" fill="#94a3b8" text-anchor="end">distros in CI</text>
  <rect x="28" y="166" width="69" height="24" rx="12" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.45"/>
  <text x="62" y="182" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Ansible</text>
  <rect x="105" y="166" width="76" height="24" rx="12" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.45"/>
  <text x="143" y="182" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">Molecule</text>
  <rect x="189" y="166" width="76" height="24" rx="12" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.45"/>
  <text x="227" y="182" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">nftables</text>
  <rect x="273" y="166" width="76" height="24" rx="12" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.45"/>
  <text x="311" y="182" class="mono" font-size="12" fill="#e2e8f0" text-anchor="middle">fail2ban</text>
